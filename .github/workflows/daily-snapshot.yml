name: Daily snapshot

# 22:00 UTC on weekdays — 6pm ET during EDT, 5pm ET during EST, so it always
# lands after the 4pm US close with time for the data to settle.
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite today's snapshot if one already exists"
        type: boolean
        default: false

# Needed to push the captured snapshot back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Capture today's screen
        run: npm run snapshot ${{ inputs.force && '-- --force' || '' }}

      - name: Commit the snapshot
        run: |
          if [ -z "$(git status --porcelain data/snapshots)" ]; then
            echo "No new snapshot — market closed, or today is already captured."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git commit -m "Snapshot $(TZ=America/New_York date +%Y-%m-%d)"
          git push
